<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dark Mode for Stripe Dashboard">
  <!-- The extension's own mark: a crescent that inverts across a light/dark split (what the theme does),
       in a palette that lives in Stripe's world: pale lavender / deep navy with a blurple accent. No Stripe logo or wordmark. -->
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="58"/></clipPath>
    <clipPath id="lightHalf"><polygon points="0,0 256,0 0,256"/></clipPath>
    <clipPath id="darkHalf"><polygon points="256,0 256,256 0,256"/></clipPath>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2540"/><stop offset="1" stop-color="#06172B"/></linearGradient>
    <linearGradient id="blurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A73FF"/><stop offset="1" stop-color="#635BFF"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3DFFF"/><stop offset="1" stop-color="#C9C3FF"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#F6F5FF"/>
    <polygon points="256,0 256,256 0,256" fill="url(#navy)"/>
    <g clip-path="url(#lightHalf)"><circle cx="126" cy="130" r="66" fill="url(#blurple)"/><circle cx="154" cy="112" r="55" fill="#F6F5FF"/></g>
    <g clip-path="url(#darkHalf)"><circle cx="126" cy="130" r="66" fill="url(#glow)"/><circle cx="154" cy="112" r="55" fill="#0A2540"/></g>
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="57" fill="none" stroke="#0A2540" stroke-opacity="0.16" stroke-width="3"/>
</svg>
